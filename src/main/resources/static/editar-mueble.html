<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Muebles — Editar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
  <div class="col-lg-7">
    <form id="muebleEditForm">
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h3 class="mb-0">Editar mueble</h3>
          <span class="text-muted" id="muebleIdBadge"></span>
        </div>
        <div class="card-body">
          <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input id="nombre" type="text" class="form-control" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Tipo</label>
            <select id="tipo" class="form-select" required>
              <option value="SILLA">SILLA</option>
              <option value="SILLON">SILLON</option>
              <option value="MESA">MESA</option>
              <option value="ESTANTE">ESTANTE</option>
              <option value="CAJON">CAJON</option>
            </select>
          </div>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Precio base</label>
              <input id="precioBase" type="number" step="0.01" min="0" class="form-control" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Stock</label>
              <input id="stock" type="number" min="0" class="form-control" required />
            </div>
          </div>
          <div class="row g-3 mt-1">
            <div class="col-md-6">
              <label class="form-label">Estado</label>
              <select id="estado" class="form-select" required>
                <option value="ACTIVO">ACTIVO</option>
                <option value="INACTIVO">INACTIVO</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Tamaño</label>
              <select id="tamano" class="form-select" required>
                <option value="GRANDE">GRANDE</option>
                <option value="MEDIANO">MEDIANO</option>
                <option value="PEQUENO">PEQUENO</option>
              </select>
            </div>
          </div>
          <div class="mt-3">
            <label class="form-label">Material</label>
            <input id="material" type="text" class="form-control" required />
          </div>
          <div class="alert d-none mt-3" id="mensaje"></div>
        </div>
        <div class="card-footer d-flex gap-2">
          <button type="submit" class="btn btn-primary">Guardar cambios</button>
          <a href="/index-muebles.html" class="btn btn-secondary">Volver al listado</a>
        </div>
      </div>
    </form>
  </div>
</div>

<script>
  const form = document.getElementById('muebleEditForm');
  const mensaje = document.getElementById('mensaje');
  const badge = document.getElementById('muebleIdBadge');

  function getIdFromQuery() {
    const p = new URLSearchParams(window.location.search);
    return p.get('id');
  }

  async function cargarMueble(id) {
    try {
      const resp = await fetch(`/api/muebles/${id}`);
      if (!resp.ok) throw new Error('No se pudo cargar el mueble');
      const m = await resp.json();
      badge.textContent = `ID: ${m.id}`;
      document.getElementById('nombre').value = m.nombre ?? '';
      document.getElementById('tipo').value = m.tipo ?? 'SILLA';
      document.getElementById('precioBase').value = m.precioBase ?? 0;
      document.getElementById('stock').value = m.stock ?? 0;
      document.getElementById('estado').value = m.estado ?? 'ACTIVO';
      document.getElementById('tamano').value = m.tamano ?? 'MEDIANO';
      document.getElementById('material').value = m.material ?? '';
    } catch (err) {
      mensaje.textContent = 'Error al cargar: ' + err.message;
      mensaje.className = 'alert alert-danger';
      mensaje.classList.remove('d-none');
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = getIdFromQuery();
    if (!id) {
      mensaje.textContent = 'Falta el parámetro ?id= en la URL';
      mensaje.className = 'alert alert-danger';
      mensaje.classList.remove('d-none');
      return;
    }
    const payload = {
      nombre: document.getElementById('nombre').value.trim(),
      tipo: document.getElementById('tipo').value,
      precioBase: document.getElementById('precioBase').value,
      stock: parseInt(document.getElementById('stock').value, 10),
      estado: document.getElementById('estado').value,
      tamano: document.getElementById('tamano').value,
      material: document.getElementById('material').value.trim()
    };
    try {
      const resp = await fetch(`/api/muebles/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!resp.ok) throw new Error(await resp.text() || ('Error HTTP ' + resp.status));
      await resp.json();
      // ✅ redirige al listado al guardar
      window.location.href = '/index-muebles.html';
    } catch (err) {
      mensaje.textContent = 'No se pudo guardar: ' + err.message;
      mensaje.className = 'alert alert-danger';
      mensaje.classList.remove('d-none');
    }
  });

  (function init() {
    const id = getIdFromQuery();
    if (!id) {
      mensaje.textContent = 'Abrí esta página con ?id={ID del mueble}';
      mensaje.className = 'alert alert-warning';
      mensaje.classList.remove('d-none');
      return;
    }
    cargarMueble(id);
  })();
</script>
</body>
</html>
