<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Variantes — Mueblería</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0">Variantes</h3>
    <div class="d-flex gap-2">
      <a href="/index-muebles.html" class="btn btn-outline-secondary">Muebles</a>
      <a href="/cotizaciones.html" class="btn btn-outline-secondary">Cotizaciones</a>
    </div>
  </div>

  <!-- Crear variante -->
  <div class="card mb-3">
    <div class="card-header">Nueva variante</div>
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Mueble</label>
          <select id="muebleSelect" class="form-select" required></select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Nombre de variante</label>
          <input id="varNombre" type="text" class="form-control" placeholder="Ej: Normal, Barniz premium" required />
        </div>
        <div class="col-md-4">
          <label class="form-label">Incremento de precio</label>
          <input id="varInc" type="number" step="0.01" min="0" value="0" class="form-control" required />
        </div>
      </div>
      <div id="msgCreate" class="alert d-none mt-3"></div>
    </div>
    <div class="card-footer">
      <button id="crearVariante" class="btn btn-primary">Crear variante</button>
    </div>
  </div>

  <!-- Filtro y listado -->
  <div class="card">
    <div class="card-header d-flex align-items-center gap-2">
      <span>Listado</span>
      <select id="filtroMueble" class="form-select" style="max-width:300px;"></select>
      <button id="filtrar" class="btn btn-sm btn-outline-primary">Filtrar</button>
      <button id="limpiarFiltro" class="btn btn-sm btn-outline-secondary">Limpiar</button>
    </div>
    <div class="card-body">
      <div id="msgList" class="alert d-none"></div>
      <div class="table-responsive">
        <table class="table align-middle">
          <thead>
            <tr>
              <th>ID</th><th>Mueble</th><th>Variante</th><th>Incremento</th><th style="width:120px;">Acciones</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  const muebleSelect   = document.getElementById('muebleSelect');
  const filtroMueble   = document.getElementById('filtroMueble');
  const varNombreInput = document.getElementById('varNombre');
  const varIncInput    = document.getElementById('varInc');
  const msgCreate      = document.getElementById('msgCreate');
  const msgList        = document.getElementById('msgList');
  const tbody          = document.getElementById('tbody');

  function setMsg(el, text, type='success') {
    el.textContent = text;
    el.className = 'alert alert-' + type;
  }

  async function cargarMueblesEnSelects() {
    const resp = await fetch('/api/muebles');
    if (!resp.ok) throw new Error('No se pudieron cargar muebles');
    const muebles = await resp.json();
    const opts = muebles.map(m => `<option value="${m.id}">${m.id} — ${m.nombre}</option>`).join('');
    muebleSelect.innerHTML = `<option value="" disabled selected>Selecciona...</option>` + opts;
    filtroMueble.innerHTML = `<option value="">(todos)</option>` + opts;
  }

  async function listarVariantes(muebleId = '') {
    msgList.className = 'alert d-none';
    const url = muebleId ? `/api/variantes?muebleId=${muebleId}` : '/api/variantes';
    const resp = await fetch(url);
    if (!resp.ok) {
      setMsg(msgList, 'No se pudieron listar variantes', 'danger');
      return;
    }
    const datos = await resp.json();
    tbody.innerHTML = datos.map(v => `
      <tr>
        <td>${v.id}</td>
        <td>${v.mueble ? (v.mueble.id + ' — ' + (v.mueble.nombre ?? '')) : ''}</td>
        <td>${v.nombre ?? ''}</td>
        <td>${v.incrementoPrecio ?? ''}</td>
        <td>
          <button class="btn btn-sm btn-danger" onclick="eliminarVar(${v.id})">Eliminar</button>
        </td>
      </tr>
    `).join('');
  }

  async function crearVariante() {
    msgCreate.className = 'alert d-none';
    const muebleId = Number(muebleSelect.value);
    const nombre = varNombreInput.value.trim();
    const incrementoPrecio = varIncInput.value;

    if (!muebleId || !nombre) {
      setMsg(msgCreate, 'Selecciona mueble y nombre de variante', 'warning');
      return;
    }

    const resp = await fetch('/api/variantes', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ muebleId, nombre, incrementoPrecio })
    });

    if (!resp.ok) {
      setMsg(msgCreate, 'No se pudo crear la variante', 'danger');
      return;
    }
    const v = await resp.json();
    setMsg(msgCreate, `Variante creada (ID ${v.id})`);
    varNombreInput.value = '';
    varIncInput.value = '0';
    listarVariantes(filtroMueble.value);
  }

  async function eliminarVar(id) {
    if (!confirm('¿Eliminar variante ' + id + '?')) return;
    const resp = await fetch('/api/variantes/' + id, { method: 'DELETE' });
    if (!resp.ok) {
      setMsg(msgList, 'No se pudo eliminar', 'danger'); 
      return;
    }
    setMsg(msgList, 'Variante ' + id + ' eliminada');
    listarVariantes(filtroMueble.value);
  }

  // Eventos
  document.getElementById('crearVariante').addEventListener('click', crearVariante);
  document.getElementById('filtrar').addEventListener('click', () => listarVariantes(filtroMueble.value));
  document.getElementById('limpiarFiltro').addEventListener('click', () => { filtroMueble.value=''; listarVariantes(); });

  // INIT
  (async function init(){
    try {
      await cargarMueblesEnSelects();
      await listarVariantes();
    } catch (e) {
      setMsg(msgList, e.message, 'danger');
    }
  })();

  // Exponer función para onclick
  window.eliminarVar = eliminarVar;
</script>
</body>
</html>
