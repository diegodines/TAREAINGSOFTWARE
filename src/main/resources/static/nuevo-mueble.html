<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Muebles — Nuevo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
  <div class="col-lg-7">
    <form id="muebleForm">
      <div class="card">
        <div class="card-header"><h3>Ingresar mueble</h3></div>
        <div class="card-body">
          <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input id="nombre" type="text" class="form-control" placeholder="Ej: Silla comedor" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Tipo</label>
            <select id="tipo" class="form-select" required>
              <option value="" disabled selected>Selecciona...</option>
              <option value="SILLA">SILLA</option>
              <option value="SILLON">SILLON</option>
              <option value="MESA">MESA</option>
              <option value="ESTANTE">ESTANTE</option>
              <option value="CAJON">CAJON</option>
            </select>
          </div>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Precio base</label>
              <input id="precioBase" type="number" step="0.01" min="0" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Stock</label>
              <input id="stock" type="number" min="0" class="form-control" required>
            </div>
          </div>
          <div class="row g-3 mt-1">
            <div class="col-md-6">
              <label class="form-label">Estado</label>
              <select id="estado" class="form-select" required>
                <option value="" disabled selected>Selecciona...</option>
                <option value="ACTIVO">ACTIVO</option>
                <option value="INACTIVO">INACTIVO</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Tamaño</label>
              <select id="tamano" class="form-select" required>
                <option value="" disabled selected>Selecciona...</option>
                <option value="GRANDE">GRANDE</option>
                <option value="MEDIANO">MEDIANO</option>
                <option value="PEQUENO">PEQUENO</option>
              </select>
            </div>
          </div>
          <div class="mt-3">
            <label class="form-label">Material</label>
            <input id="material" type="text" class="form-control" placeholder="Ej: Madera, Melamina, Metal" required>
          </div>
          <div id="mensaje" class="alert d-none mt-3"></div>
        </div>
        <div class="card-footer d-flex gap-2">
          <button type="submit" class="btn btn-primary">Guardar</button>
          <a href="/index-muebles.html" class="btn btn-secondary">Volver al listado</a>
        </div>
      </div>
    </form>
  </div>
</div>

<script>
  const msg = document.getElementById('mensaje');
  document.getElementById('muebleForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = 'alert d-none';

    const payload = {
      nombre: document.getElementById('nombre').value.trim(),
      tipo: document.getElementById('tipo').value,
      precioBase: document.getElementById('precioBase').value,
      stock: parseInt(document.getElementById('stock').value, 10),
      estado: document.getElementById('estado').value,
      tamano: document.getElementById('tamano').value,
      material: document.getElementById('material').value.trim()
    };

    try {
      const resp = await fetch('/api/muebles', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!resp.ok) throw new Error(await resp.text() || ('HTTP ' + resp.status));
      const data = await resp.json();
      msg.textContent = 'Mueble guardado con ID: ' + data.id;
      msg.className = 'alert alert-success';
      e.target.reset();
      document.getElementById('tipo').selectedIndex = 0;
      document.getElementById('estado').selectedIndex = 0;
      document.getElementById('tamano').selectedIndex = 0;
    } catch (err) {
      msg.textContent = 'No se pudo guardar: ' + err.message;
      msg.className = 'alert alert-danger';
    }
  });
</script>
</body>
</html>
